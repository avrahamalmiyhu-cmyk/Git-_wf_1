name: work with environments 
env: 
  APP_NAME:  "${{  github.repository }}-TEST_APP "
  OWNER: "Avi"
on: 
   push:
    branches:
    - main 
    - master 


   workflow_dispatch: 


jobs:
  job-1:  
    runs-on: ubuntu-latest 
    steps:
       - name: say hello 
         run: echo "hello world!!"
 
       - name: multiline commad 
         run: |
          ls -la 
          pwd 
          echo "App name: ${{ env.APP_NAME }}" 
          echo  "owned by  : ${{env.OWNER }}"
          echo "gitub action: ${{ github.action }}"
          echo "Evnet : ${{ github.event_name }}"
       - uses: actions/checkout@v3
    
       - run: ls -la 
    
       - run: ls -la
  job-2 :  
    
    runs-on: ubuntu-latest 
    needs: ["job-1"]    
    steps:
       - name: say hello 
         run: echo "hello world!!"
 
       - name: multiline commad 
         run: |
          ls -la 
          pwd 
          echo "HI ! "
          
       - uses: actions/checkout@v3
    
       - run: ls -la  